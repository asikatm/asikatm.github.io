<body>
  <header class="hd">
    <div class="wrap hd-row">
      <a class="brand" href="#/">
        <span class="brand-logo"><i class="bi bi-bag-heart-fill"></i></span>
        <span><span class="brand-name" id="shopName">Garments Showroom</span><span class="brand-tag">Always better quality</span></span>
      </a>
      <form class="search" id="searchForm" role="search">
        <i class="bi bi-search"></i>
        <input id="searchInput" type="search" placeholder="শাড়ি খুঁজুন… (নাম বা কোড)" aria-label="Search" />
      </form>
      <a class="hd-call" id="hdCall" href="#"><i class="bi bi-telephone-fill"></i><span id="hdPhone"></span></a>
      <a class="cart-btn" href="#/checkout" aria-label="Cart"><i class="bi bi-bag"></i><span class="cart-count" id="cartCount">0</span></a>
    </div>
    <nav class="wrap cats" id="catNav" aria-label="Categories"></nav>
  </header>

  <div class="status-bar" id="statusBar" hidden></div>

  <main id="app" class="wrap" tabindex="-1">
    <div class="loading"><span class="spinner"></span> লোড হচ্ছে…</div>
  </main>

  <footer class="ft">
    <div class="wrap ft-row">
      <div>
        <div class="ft-name" id="ftName">Garments Showroom</div>
        <div class="ft-sub">ক্যাশ অন ডেলিভারি · সারা দেশে হোম ডেলিভারি</div>
      </div>
      <div class="ft-contact" id="ftContact"></div>
      <div class="ft-dev">Developed by <a href="https://asikatm.github.io/" target="_blank" rel="noopener">Md. Asikur Rahman</a></div>
    </div>
  </footer>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp" hidden><i class="bi bi-whatsapp"></i></a>

  <script src="app.js?v=1"></script>
